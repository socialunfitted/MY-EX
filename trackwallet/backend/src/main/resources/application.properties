# ============================================================
# TrackWallet - Application Properties
# Copy this to application.properties and fill in your values
# ============================================================

# Server
server.port=8080
server.servlet.context-path=/

# ============================================================
# SUPABASE POSTGRESQL CONNECTION
# Project URL: https://givqmvmpjssqklhufigr.supabase.co
# ============================================================
spring.datasource.url=jdbc:postgresql://db.givqmvmpjssqklhufigr.supabase.co:5432/postgres
spring.datasource.username=postgres
# Insert your Supabase Database Password below:
spring.datasource.password=YOUR_SUPABASE_DB_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# JWT CONFIGURATION
# ============================================================
app.jwt.secret=c3VwZXJzZWNyZXRqd3RzZWNyZXRrZXlmb3J0cmFja3dhbGxldGFwcGxpY2F0aW9uMjAyNg==
app.jwt.expiration=86400000
# Token expiry in ms: 86400000 = 24 hours

# ============================================================
# CORS (Frontend origins)
# ============================================================
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,file://

# ============================================================
# FILE UPLOAD
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ============================================================
# LOGGING
# ============================================================
logging.level.com.trackwallet=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

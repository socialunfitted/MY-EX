<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackWallet — Loans & EMI</title>
  <meta name="description" content="Manage personal loans, vehicle loans, home loans and monthly EMIs">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .loan-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: var(--space-lg);
    }
    .loan-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
      position: relative;
    }
    .loan-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-md);
    }
    .loan-title { font-size: 16px; font-weight: 700; color: var(--text-primary); }
    .loan-lender { font-size: 12px; color: var(--text-muted); }
    .loan-amounts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-md);
      margin: 16px 0;
      padding: 12px;
      background: var(--bg-tertiary);
      border-radius: var(--radius-md);
    }
    .loan-amt-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .loan-amt-val { font-size: 18px; font-weight: 800; color: var(--text-primary); margin-top: 2px; }
  </style>
</head>
<body>
  <div class="app-layout">
    <div id="app-sidebar"></div>

    <main class="main-content">
      <div id="app-mobile-header"></div>

      <!-- Page Header -->
      <div class="page-header">
        <div>
          <h1 class="page-title">Loans & EMI Management</h1>
          <p class="page-subtitle">Track outstanding principal, interest rates, paid history, and upcoming EMIs</p>
        </div>
        <button class="btn btn-primary" onclick="openAddLoanModal()">
          <span class="material-icons-round">add</span> Add Loan / EMI
        </button>
      </div>

      <!-- Overall Debt Summary -->
      <div class="card mb-lg card-glass flex items-center justify-between" style="padding:20px">
        <div>
          <div style="font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em">Total Outstanding Debt</div>
          <div style="font-size:28px;font-weight:800;color:var(--danger);margin-top:2px" id="total-debt-val">Loading...</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:12px;color:var(--text-muted)">Total Monthly EMI Commitment</div>
          <div style="font-size:20px;font-weight:700;color:var(--warning);margin-top:2px" id="total-emi-val">₹0</div>
        </div>
      </div>

      <!-- Loan Cards Grid -->
      <div class="loan-cards-grid" id="loans-grid">
        <div class="loading"><div class="spinner"></div><span>Loading loans...</span></div>
      </div>
    </main>
  </div>

  <!-- Loan Modal -->
  <div class="modal-overlay" id="loan-modal">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h3 class="modal-title" id="loan-modal-title">Add Loan / EMI</h3>
        <button class="modal-close" onclick="closeModal('loan-modal')">
          <span class="material-icons-round">close</span>
        </button>
      </div>

      <form id="loan-form">
        <input type="hidden" id="loan-id">

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Loan Name *</label>
            <input type="text" class="form-control" id="loan-name" placeholder="e.g. Home Loan, Camera EMI" required>
          </div>

          <div class="form-group">
            <label class="form-label">Lender / Institution</label>
            <input type="text" class="form-control" id="loan-lender" placeholder="e.g. Pandiyan Finance, Bank">
          </div>

          <div class="form-group">
            <label class="form-label">Loan Type</label>
            <select class="form-control" id="loan-type">
              <option value="PERSONAL">Personal Loan</option>
              <option value="HOME">Home Loan</option>
              <option value="VEHICLE">Vehicle Loan</option>
              <option value="GOLD">Gold Loan</option>
              <option value="BUSINESS">Business Loan</option>
              <option value="EMI">Consumer EMI</option>
              <option value="OTHER">Other</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Principal Amount (₹)</label>
            <input type="number" step="0.01" class="form-control" id="loan-principal" placeholder="0.00">
          </div>

          <div class="form-group">
            <label class="form-label">Current Outstanding (₹) *</label>
            <input type="number" step="0.01" class="form-control" id="loan-outstanding" placeholder="0.00" required>
          </div>

          <div class="form-group">
            <label class="form-label">Monthly EMI (₹) *</label>
            <input type="number" step="0.01" class="form-control" id="loan-emi" placeholder="0.00" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Interest Rate (%)</label>
            <input type="number" step="0.01" class="form-control" id="loan-rate" placeholder="e.g. 12.5">
          </div>

          <div class="form-group">
            <label class="form-label">Next Payment Date</label>
            <input type="date" class="form-control" id="loan-next-date">
          </div>

          <div class="form-group">
            <label class="form-label">Linked Account</label>
            <select class="form-control" id="loan-account"></select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Notes</label>
          <textarea class="form-control" id="loan-notes" placeholder="Loan account number, branch, or remarks"></textarea>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('loan-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Loan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Record Payment Modal -->
  <div class="modal-overlay" id="pay-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Record EMI Payment</h3>
        <button class="modal-close" onclick="closeModal('pay-modal')">
          <span class="material-icons-round">close</span>
        </button>
      </div>

      <form id="pay-form">
        <input type="hidden" id="pay-loan-id">

        <div class="form-group">
          <label class="form-label">Payment Amount (₹) *</label>
          <input type="number" step="0.01" class="form-control" id="pay-amount" required>
        </div>

        <div class="form-group">
          <label class="form-label">Payment Date *</label>
          <input type="date" class="form-control" id="pay-date" required>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('pay-modal')">Cancel</button>
          <button type="submit" class="btn btn-success">Mark As Paid</button>
        </div>
      </form>
    </div>
  </div>

  <div id="app-bottom-nav"></div>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
  <script src="js/loans.js"></script>
</body>
</html>

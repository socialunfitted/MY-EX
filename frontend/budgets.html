<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackWallet — Budgets</title>
  <meta name="description" content="Set and monitor monthly, category and business budgets with progress bars and alerts">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-layout">
    <div id="app-sidebar"></div>

    <main class="main-content">
      <div id="app-mobile-header"></div>

      <!-- Page Header -->
      <div class="page-header">
        <div>
          <h1 class="page-title">Budgets</h1>
          <p class="page-subtitle">Control your spending by setting monthly and category budgets</p>
        </div>
        <button class="btn btn-primary" onclick="openAddBudgetModal()">
          <span class="material-icons-round">add</span> Create Budget
        </button>
      </div>

      <!-- Budgets List -->
      <div class="grid-2" id="budgets-grid">
        <div class="loading"><div class="spinner"></div><span>Loading budgets...</span></div>
      </div>
    </main>
  </div>

  <!-- Budget Modal -->
  <div class="modal-overlay" id="budget-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Create Budget</h3>
        <button class="modal-close" onclick="closeModal('budget-modal')">
          <span class="material-icons-round">close</span>
        </button>
      </div>

      <form id="budget-form">
        <div class="form-group">
          <label class="form-label">Budget Name *</label>
          <input type="text" class="form-control" id="bgt-name" placeholder="e.g. Monthly Food Budget, Bike Fuel" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Period</label>
            <select class="form-control" id="bgt-period">
              <option value="MONTHLY">Monthly</option>
              <option value="YEARLY">Yearly</option>
              <option value="CUSTOM">Custom</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Total Budget Amount (₹) *</label>
            <input type="number" step="0.01" class="form-control" id="bgt-amount" placeholder="10000" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Start Date *</label>
            <input type="date" class="form-control" id="bgt-start-date" required>
          </div>

          <div class="form-group">
            <label class="form-label">End Date *</label>
            <input type="date" class="form-control" id="bgt-end-date" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Alert Threshold (%)</label>
          <input type="number" class="form-control" id="bgt-threshold" value="80" placeholder="80">
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('budget-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Budget</button>
        </div>
      </form>
    </div>
  </div>

  <div id="app-bottom-nav"></div>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
  <script src="js/budgets.js"></script>
</body>
</html>

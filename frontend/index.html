<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackWallet — Login</title>
  <meta name="description" content="Sign in to TrackWallet — Your personal finance management system">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .login-features {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: var(--space-xl);
    }
    .login-feature {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-secondary);
      font-size: 13px;
    }
    .login-feature .material-icons-round {
      color: var(--primary-light);
      font-size: 18px;
    }
    .demo-badge {
      background: rgba(99,102,241,0.1);
      border: 1px solid rgba(99,102,241,0.2);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      margin-bottom: var(--space-md);
      font-size: 12px;
      color: var(--primary-light);
      text-align: center;
    }
    .error-msg {
      color: var(--danger);
      font-size: 13px;
      text-align: center;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-bg-glow"></div>

    <div class="login-card">
      <div class="login-logo">
        <div class="logo-circle">💰</div>
        <h1>TrackWallet</h1>
        <p>Personal Finance Management</p>
      </div>

      <div class="demo-badge">
        <div class="flex items-center gap-xs">
          <span class="material-icons-round" style="font-size:16px">info</span>
          <span>Demo: <strong>admin</strong> / <strong>trackwallet123</strong></span>
        </div>
        <button type="button" onclick="fillDemo()" class="btn btn-ghost btn-sm" style="padding:2px 6px;font-size:11px;color:var(--primary-light)">
          Auto Fill
        </button>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Enter username"
                 value="admin" required autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-group">
            <input type="password" id="password" class="form-control" placeholder="Enter password"
                   value="trackwallet123" required autocomplete="current-password">
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" title="Toggle password visibility">
              <span class="material-icons-round" id="toggle-icon">visibility</span>
            </button>
          </div>
        </div>

        <div id="login-error" class="error-msg"></div>

        <button type="submit" class="btn btn-primary w-full btn-lg" id="login-btn" style="margin-top:8px">
          <span class="material-icons-round">login</span>
          Sign In
        </button>
      </form>

      <div class="divider"></div>

      <div class="login-features">
        <div class="login-feature">
          <span class="material-icons-round">account_balance_wallet</span>
          Transaction Ledger
        </div>
        <div class="login-feature">
          <span class="material-icons-round">storefront</span>
          Business Finance
        </div>
        <div class="login-feature">
          <span class="material-icons-round">credit_score</span>
          Loans & Monthly EMI
        </div>
        <div class="login-feature">
          <span class="material-icons-round">bar_chart</span>
          Reports & Analytics
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    // Redirect if already logged in
    if (localStorage.getItem('tw_token')) {
      window.location.href = 'dashboard.html';
    }

    function fillDemo() {
      document.getElementById('username').value = 'admin';
      document.getElementById('password').value = 'trackwallet123';
    }

    function togglePasswordVisibility() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('toggle-icon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        pwd.type = 'password';
        icon.textContent = 'visibility';
      }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const errEl = document.getElementById('login-error');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px"></div> Signing in...';
      errEl.style.display = 'none';

      try {
        const res = await API.auth.login(username, password);
        localStorage.setItem('tw_token', res.token);
        localStorage.setItem('tw_user', JSON.stringify({
          username: res.username,
          fullName: res.fullName,
          userId: res.userId,
          currency: res.currency
        }));
        window.location.href = 'dashboard.html';
      } catch (err) {
        errEl.textContent = err.message || 'Invalid username or password';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '<span class="material-icons-round">login</span> Sign In';
      }
    });
  </script>
</body>
</html>
